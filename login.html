<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WINNIE - Web-based Institutional Nursing Name-list Issuance of E-Certificates</title>
  <style>
    :root { color-scheme: dark; --bg:#0e0e10; --card:#17171a; --border:#2e2e38; --gold:#c8a96e; --text:#e8e8f0; --muted:#8c8c9f; --danger:#ff8585; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at top,#24212b 0,var(--bg) 52%); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(100%,541px); padding:38px; border:1px solid var(--border); border-radius:16px; background:rgba(23,23,26,.96); box-shadow:0 24px 80px #0008; }
    h1 { margin:0; color:var(--gold); font-family:Georgia,serif; letter-spacing:.04em; }
    .subtitle { margin:6px 0 30px; color:var(--muted); font-size:13px; }
    label { display:block; margin-bottom:8px; font-size:13px; font-weight:650; }
    input { width:100%; min-height:48px; padding:0 14px; border:1px solid var(--border); border-radius:9px; background:#0f0f12; color:var(--text); font:inherit; outline:none; }
    input:focus { border-color:var(--gold); box-shadow:0 0 0 3px #c8a96e22; }
    .notice { margin:9px 0 20px; color:var(--muted); font-size:12px; }
    button { width:100%; min-height:48px; border:0; border-radius:9px; background:var(--gold); color:#17120a; font:inherit; font-weight:750; cursor:pointer; }
    button:disabled { opacity:.65; cursor:wait; }
    .error { min-height:20px; margin:14px 0 0; color:var(--danger); font-size:13px; text-align:center; }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <h1 id="title">WINNIE</h1>
    <p class="subtitle">Web-based Institutional Nursing Name-list Issuance of E-Certificates</p>
    <form id="loginForm" novalidate>
      <label for="accessId">ID</label>
      <input id="accessId" name="id" type="text" autocomplete="username" maxlength="128" autofocus required>
      <p class="notice">Don’t have an ID? Get one from the administrator.</p>
      <button id="submitButton" type="submit">Continue</button>
      <p class="error" id="errorMessage" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const input = document.getElementById('accessId');
    const button = document.getElementById('submitButton');
    const error = document.getElementById('errorMessage');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      error.textContent = '';
      button.disabled = true;
      button.textContent = 'Checking…';
      try {
        const response = await fetch('/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: input.value })
        });
        if (!response.ok) throw new Error();
        location.replace('/');
      } catch {
        error.textContent = 'ID Not Found';
        input.select();
        input.focus();
      } finally {
        button.disabled = false;
        button.textContent = 'Continue';
      }
    });
  </script>
</body>
</html>
